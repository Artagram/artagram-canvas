server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: artagram-canvas
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_lienzo}
    username: ${DB_USER:artagram}
    password: ${DB_PASSWORD:artagram}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:artagram}
    password: ${RABBITMQ_PASSWORD:artagram}

app:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../artagram-infra/secrets-dev/jwt-public.pem}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:artagram.events}
  lienzo:
    # ARTAGRAM-backv1 sigue siendo dueño de comunidades/membresías; se le
    # consulta por este endpoint interno (mismo que ya usa artagram-chat)
    # hasta que "community" se migre.
    internal-url: ${LIENZO_INTERNAL_URL:http://localhost:8084}
  storage:
    s3:
      bucket: ${S3_BUCKET:artagram-uploads}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:}}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access: ${S3_PATH_STYLE:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    com.artagram: DEBUG
